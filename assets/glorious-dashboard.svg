<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, Arial, sans-serif">
  <!-- Simplified illustration of the inventory dashboard. Replace with a real screenshot when you have one (see README). -->
  <rect width="960" height="600" fill="#0d1424"/>
  <!-- top bar -->
  <rect width="960" height="58" fill="#111a2e"/>
  <text x="28" y="36" fill="#e8ecf5" font-size="17" font-weight="700">Glorious Treats <tspan fill="#f59e0b">&amp;</tspan> Chews</text>
  <rect x="262" y="17" width="92" height="26" rx="13" fill="#e8ecf5"/>
  <text x="308" y="35" text-anchor="middle" fill="#0d1424" font-size="13" font-weight="600">Inventory</text>
  <text x="392" y="35" fill="#97a3bd" font-size="13">History</text>
  <rect x="820" y="17" width="112" height="26" rx="8" fill="#2fd3a6" opacity=".15"/>
  <text x="876" y="35" text-anchor="middle" fill="#2fd3a6" font-size="13" font-weight="600">↻ Sync all</text>
  <!-- channel tabs -->
  <rect x="28" y="80" width="904" height="40" rx="10" fill="#111a2e"/>
  <rect x="34" y="86" width="218" height="28" rx="7" fill="#3b6cf6"/>
  <text x="143" y="105" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">All channels</text>
  <text x="365" y="105" text-anchor="middle" fill="#97a3bd" font-size="13">Amazon</text>
  <text x="590" y="105" text-anchor="middle" fill="#97a3bd" font-size="13">Shopify</text>
  <text x="815" y="105" text-anchor="middle" fill="#97a3bd" font-size="13">eBay</text>
  <!-- stat cards -->
  <g font-size="12">
    <rect x="28" y="138" width="214" height="84" rx="12" fill="#111a2e" stroke="#22304d"/>
    <text x="48" y="178" fill="#e8ecf5" font-size="30" font-weight="800">172</text><text x="48" y="204" fill="#97a3bd">Total products</text>
    <rect x="258" y="138" width="214" height="84" rx="12" fill="#0f2a24" stroke="#1d4d40"/>
    <rect x="278" y="160" width="120" height="16" rx="8" fill="#2fd3a6" opacity=".8"/><text x="278" y="204" fill="#97a3bd">In stock</text>
    <rect x="488" y="138" width="214" height="84" rx="12" fill="#2b2410" stroke="#4d4019"/>
    <rect x="508" y="160" width="46" height="16" rx="8" fill="#f59e0b" opacity=".8"/><text x="508" y="204" fill="#97a3bd">Low stock</text>
    <rect x="718" y="138" width="214" height="84" rx="12" fill="#2b1418" stroke="#4d2229"/>
    <rect x="738" y="160" width="70" height="16" rx="8" fill="#f43f5e" opacity=".8"/><text x="738" y="204" fill="#97a3bd">Out of stock</text>
  </g>
  <!-- search -->
  <rect x="28" y="240" width="904" height="36" rx="9" fill="#111a2e" stroke="#22304d"/>
  <text x="48" y="263" fill="#5d6a86" font-size="13">Search by product name or SKU…</text>
  <!-- table -->
  <rect x="28" y="292" width="904" height="284" rx="12" fill="#111a2e" stroke="#22304d"/>
  <g fill="#97a3bd" font-size="11" font-weight="700" letter-spacing=".06em">
    <text x="48" y="320">PRODUCT</text><text x="560" y="320">AMAZON</text><text x="650" y="320">SHOPIFY</text>
    <text x="736" y="320">EBAY</text><text x="800" y="320">TOTAL</text><text x="868" y="320">STATUS</text>
  </g>
  <line x1="28" y1="334" x2="932" y2="334" stroke="#22304d"/>
  <g font-size="13" fill="#e8ecf5">
    <text x="48" y="366">Natural Beef Collagen Chews</text>
    <text x="48" y="420">Beef Trachea Dog Chews</text>
    <text x="48" y="474">Single-Ingredient Training Treats</text>
    <text x="48" y="528">Long-Lasting Beef Sticks</text>
  </g>
  <g font-size="11" fill="#5d6a86">
    <text x="48" y="384">Dental health · digestive wellness</text>
    <text x="48" y="438">100% natural · all breeds</text>
    <text x="48" y="492">High protein · grain free</text>
    <text x="48" y="546">Air-dried · long lasting</text>
  </g>
  <g fill="#22304d">
    <line x1="48" y1="398" x2="912" y2="398" stroke="#1a2540"/>
    <line x1="48" y1="452" x2="912" y2="452" stroke="#1a2540"/>
    <line x1="48" y1="506" x2="912" y2="506" stroke="#1a2540"/>
  </g>
  <!-- stock bars instead of real numbers -->
  <g>
    <rect x="560" y="358" width="44" height="10" rx="5" fill="#3b6cf6"/><rect x="650" y="358" width="30" height="10" rx="5" fill="#3b6cf6"/><rect x="736" y="358" width="20" height="10" rx="5" fill="#3b6cf6"/><rect x="800" y="358" width="40" height="10" rx="5" fill="#e8ecf5" opacity=".7"/>
    <rect x="560" y="412" width="36" height="10" rx="5" fill="#3b6cf6"/><rect x="650" y="412" width="22" height="10" rx="5" fill="#3b6cf6"/><rect x="736" y="412" width="12" height="10" rx="5" fill="#3b6cf6"/><rect x="800" y="412" width="32" height="10" rx="5" fill="#e8ecf5" opacity=".7"/>
    <rect x="560" y="466" width="10" height="10" rx="5" fill="#3b6cf6"/><rect x="650" y="466" width="6" height="10" rx="3" fill="#3b6cf6"/><rect x="736" y="466" width="4" height="10" rx="2" fill="#3b6cf6"/><rect x="800" y="466" width="12" height="10" rx="5" fill="#e8ecf5" opacity=".7"/>
    <rect x="800" y="520" width="4" height="10" rx="2" fill="#e8ecf5" opacity=".4"/>
  </g>
  <g font-size="11" font-weight="700">
    <rect x="862" y="353" width="58" height="20" rx="10" fill="#2fd3a6" opacity=".18"/><text x="891" y="367" text-anchor="middle" fill="#2fd3a6">In stock</text>
    <rect x="862" y="407" width="58" height="20" rx="10" fill="#2fd3a6" opacity=".18"/><text x="891" y="421" text-anchor="middle" fill="#2fd3a6">In stock</text>
    <rect x="862" y="461" width="58" height="20" rx="10" fill="#f59e0b" opacity=".18"/><text x="891" y="475" text-anchor="middle" fill="#f59e0b">Low</text>
    <rect x="862" y="515" width="58" height="20" rx="10" fill="#f43f5e" opacity=".18"/><text x="891" y="529" text-anchor="middle" fill="#f43f5e">Out</text>
  </g>
</svg>
